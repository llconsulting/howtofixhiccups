[build]
  publish = "."

# Production (.com) stays indexable. Do not set noindex here.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Netlify hosts only. Canonicals stay on https://howtofixhiccups.com/.
[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Dropped blog / about / notes. Send them home. No Notes index.
[[redirects]]
  from = "/about"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/about/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/notes"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/notes/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/blog"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/*"
  to = "/"
  status = 301
  force = true

# First rebuild used shorter slugs. Keep those working.
[[redirects]]
  from = "/why"
  to = "/why-hiccups-start/"
  status = 301
  force = true

[[redirects]]
  from = "/why/"
  to = "/why-hiccups-start/"
  status = 301
  force = true

[[redirects]]
  from = "/when"
  to = "/when-to-stop/"
  status = 301
  force = true

[[redirects]]
  from = "/when/"
  to = "/when-to-stop/"
  status = 301
  force = true
