[build]
  publish = "."

# Production (.com) stays indexable. Do not set noindex here.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Netlify hosts only. Canonicals stay on https://howtofixhiccups.com/.
[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Dropped about / notes. Home is the live replacement.
[[redirects]]
  from = "/about"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/about/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/notes"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/notes/"
  to = "/"
  status = 301
  force = true

