[build]
  command = "bash scripts/check-primary-nav.sh"
  publish = "."

# Production and preview. Host check lives in the function: *.netlify.app
# is noindex; howtofixhiccups.com is untouched.
[[edge_functions]]
  function = "noindex-netlify-host"
  path = "/*"

# Production (.com) stays indexable. Do not set X-Robots-Tag here.
# Main used to send X-Robots-Tag: index, follow on howtofixhiccups.netlify.app.
# The edge function is what noindexes that host after merge.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Netlify hosts only. Canonicals stay on https://howtofixhiccups.com/.
[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex, nofollow"

