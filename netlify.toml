[build]
  command = "bash scripts/check-primary-nav.sh && python3 scripts/check-locale.py"
  publish = "."

# preview-html runs on every host. noindex-netlify-host is disabled until
# howtofixhiccups.com is connected. The restore steps are in the comment below.
[[edge_functions]]
  function = "preview-html"
  path = "/*"

# DISABLED 2026-10-12 (Mike): let howtofixhiccups.netlify.app be indexed until
# howtofixhiccups.com is connected. To restore when the .com goes live:
#   git mv netlify/edge-functions-disabled/noindex-netlify-host.js netlify/edge-functions/
#   and uncomment the block below. (The file's inline config also registers it.)
# [[edge_functions]]
#   function = "noindex-netlify-host"
#   path = "/*"

# Do not set X-Robots-Tag on production. howtofixhiccups.netlify.app is indexable
# until howtofixhiccups.com is connected. The noindex function is disabled above.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Deploy previews and branch deploys stay noindex. Production does not set X-Robots-Tag.
[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex, nofollow"

